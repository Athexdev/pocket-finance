<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPulse - Create Account</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        glow: {
                            '0%, 100%': { filter: 'brightness(1) blur(0px)' },
                            '50%': { filter: 'brightness(1.2) blur(1px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #050816;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-form {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(79, 172, 254, 0.2);
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(79, 172, 254, 0.05);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="font-inter">
    <div id="container"></div>

    <!-- Top Left Logo -->
    <a href="{% url 'landing' %}" class="fixed top-5 left-8 z-50 flex items-center group transition-all duration-300">
        <span class="text-2xl font-bold tracking-tight">
            <span style="color: #4facfe;" class="group-hover:drop-shadow-[0_0_8px_rgba(79,172,254,0.5)] transition-all">Pocket</span><span style="color: #00f2fe;" class="group-hover:drop-shadow-[0_0_8px_rgba(0,242,254,0.5)] transition-all">Pulse</span>
        </span>
    </a>
    
    <div class="fixed inset-0 flex items-center justify-center p-4 z-10 overflow-y-auto">
        <div class="w-full max-w-md animate-float my-8">
            <div class="glass-form rounded-[2.5rem] p-8 md:p-10 relative overflow-hidden">
                <!-- Branding -->
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold tracking-tight mb-2">
                        <span style="color: #4facfe;">Pocket</span><span style="color: #00f2fe;">Pulse</span>
                    </h1>
                    <p class="text-gray-400 text-sm font-medium opacity-80">Feel the rhythm of your finances</p>
                </div>

                <!-- Registration Form -->
                <form method="post" action="{% url 'register' %}" class="space-y-4">
                    {% csrf_token %}
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="p-4 rounded-2xl {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/20 text-red-400{% else %}bg-green-500/10 border border-green-500/20 text-green-400{% endif %} text-xs">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <div class="space-y-4">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
                            <input type="text" name="username" class="w-full px-5 py-3.5 rounded-2xl input-glass text-sm" placeholder="Choose a username" required="">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Email Address</label>
                            <input type="email" name="email" class="w-full px-5 py-3.5 rounded-2xl input-glass text-sm" placeholder="Enter your email" required="">
                        </div>
                        
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
                            <input type="password" name="password" class="w-full px-5 py-3.5 rounded-2xl input-glass text-sm" placeholder="Create a password" required="">
                        </div>

                        <div>
                            <label class="block text-[11px] font-semibold text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Confirm Password</label>
                            <input type="password" name="confirm_password" class="w-full px-5 py-3.5 rounded-2xl input-glass text-sm" placeholder="Confirm your password" required="">
                        </div>
                    </div>

                    <!-- Create Account Button -->
                    <button type="submit" class="w-full py-4 px-6 btn-gradient text-white font-bold rounded-2xl shadow-lg mt-6">
                        Create Account
                    </button>

                    <!-- Sign In Link -->
                    <p class="text-center text-sm text-gray-500 mt-8">
                        Already joined? 
                        <a href="{% url 'login' %}" class="text-[#00f2fe] font-semibold hover:underline decoration-2 underline-offset-4 ml-1">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, material;
        let startTime = Date.now();

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            uniform vec2 iResolution;
            varying vec2 vUv;

            #define S smoothstep

            vec4 Line(vec2 uv, float speed, float height, vec3 col) {
                uv.y += S(1., 0., abs(uv.x)) * sin(iTime * speed + uv.x * height) * 0.2;
                return vec4(S(0.08 * S(0.2, 0.9, abs(uv.x)), 0., abs(uv.y) - 0.004) * col, 1.0) * S(1., 0.3, abs(uv.x));
            }

            void main() {
                vec2 uv = (vUv - 0.5) * vec2(iResolution.x / iResolution.y, 1.0);
                vec4 O = vec4(0.02, 0.03, 0.09, 1.0);
                
                for (float i = 0.; i <= 5.; i += 1.) {
                    float t = i / 5.;
                    float timeOffset = iTime * 0.2 + t * 4.0;
                    
                    vec3 blueColor = vec3(0.31, 0.67, 0.99); // #4facfe
                    vec3 greenColor = vec3(0.00, 0.95, 0.99); // #00f2fe
                    
                    vec3 auroraColor = mix(blueColor, greenColor, sin(timeOffset) * 0.5 + 0.5);
                    O += Line(uv, 0.5 + t * 0.5, 3.0 + t * 2.0, auroraColor) * 0.7;
                }
                
                gl_FragColor = O;
            }
        `;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    iTime: { value: 0 },
                    iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                }
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            const plane = new THREE.Mesh(geometry, material);
            scene.add(plane);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.iTime.value = (Date.now() - startTime) * 0.001;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);
        init();
    </script>
</body>
</html>
